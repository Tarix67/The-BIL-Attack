<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Prototype</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d1117;
    font-family: 'Courier New', monospace;
    color: #eee;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #ui {
    position: fixed; top: 10px; left: 10px; right: 60px;
    display: flex; justify-content: space-between;
    font-size: clamp(13px, 3.5vw, 18px);
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }
  canvas {
    image-rendering: pixelated;
    display: block;
    background: #0d1117;
    touch-action: none;
  }
  #pauseBtn {
    position: fixed; top: 8px; right: 8px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.4);
    color: #fff;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
    touch-action: manipulation;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
  }
  .panel {
    background: #16213e;
    border: 2px solid #4ecdc4;
    border-radius: 10px;
    padding: 24px 28px;
    min-width: 240px;
    text-align: center;
    text-shadow: none;
  }
  .panel h2 { margin-top: 0; color: #4ecdc4; font-size: clamp(20px, 5vw, 26px); }
  .panel button {
    display: block; width: 100%;
    background: #4ecdc4; color: #0d1117; border: none;
    padding: 12px; margin: 8px 0; font-size: 16px; cursor: pointer;
    font-family: inherit; border-radius: 6px; font-weight: bold;
    touch-action: manipulation;
  }
  .panel button.secondary { background: #2a2a44; color: #eee; }
  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    margin: 14px 0; gap: 10px;
  }
  .theme-buttons { display: flex; gap: 6px; }
  .theme-buttons button {
    margin: 0; padding: 8px 10px; font-size: 13px; width: auto;
  }
  .theme-buttons button.active { outline: 3px solid #ffd93d; }
  #gameover {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
    text-shadow: 2px 2px 0 #000;
    z-index: 10;
    width: 80%;
  }
  #gameover h1 { color: #e94560; font-size: clamp(28px, 8vw, 40px); margin-bottom: 10px; }
  #gameover p { font-size: clamp(16px, 4vw, 20px); }
  #gameover button {
    background: #e94560; color: white; border: none;
    padding: 14px 28px; font-size: clamp(16px, 4vw, 18px); cursor: pointer;
    font-family: inherit; border-radius: 4px;
    touch-action: manipulation; margin: 4px;
  }
  #submitStatus { font-size: clamp(13px, 3.5vw, 16px) !important; min-height: 1.4em; color: #ffd93d; }
  #nameInput {
    width: 100%; box-sizing: border-box;
    padding: 12px; margin: 10px 0 4px;
    font-size: 18px; font-family: inherit; text-align: center;
    border-radius: 6px; border: 2px solid #4ecdc4;
    background: #0d1117; color: #fff;
    -webkit-user-select: text; user-select: text;
  }
  #nameError { color: #e94560; font-size: 13px; min-height: 1.2em; margin: 0 0 6px; }
</style>
</head>
<body>

<div id="ui">
  <span>HP: <span id="hp">100</span></span>
  <span>Счёт: <span id="score">0</span></span>
  <span>Волна: <span id="wave">1</span> (<span id="remaining">0</span>)</span>
</div>

<button id="pauseBtn">⏸</button>

<canvas id="game"></canvas>

<div id="pauseOverlay" class="overlay">
  <div class="panel">
    <h2>Пауза</h2>
    <button id="resumeBtn">Продолжить</button>
    <button id="openSettingsBtn" class="secondary">Настройки</button>
    <button id="restartFromPauseBtn" class="secondary">Начать заново</button>
  </div>
</div>

<div id="settingsOverlay" class="overlay">
  <div class="panel">
    <h2>Настройки</h2>
    <div class="settings-row">
      <span>Стилистика</span>
      <div class="theme-buttons" id="themeButtons">
        <button data-theme="desert">Пустыня</button>
        <button data-theme="office">Офис</button>
      </div>
    </div>
    <div class="settings-row">
      <span>Звук</span>
      <label><input type="checkbox" id="soundToggle" checked></label>
    </div>
    <button id="backToPauseBtn" class="secondary">Назад</button>
  </div>
</div>

<div id="startOverlay" class="overlay" style="display:flex;">
  <div class="panel">
    <h2>Введите имя</h2>
    <p style="margin:0 0 4px;font-size:13px;">Имя и фамилия, чтобы мы знали, кому вручить награду</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="Например: Иван П." autocomplete="off">
    <p id="nameError"></p>
    <button id="startBtn">Играть</button>
  </div>
</div>

<div id="gameover">
  <h1>ТЫ ПОЙМАН</h1>
  <p>Счёт: <span id="finalScore">0</span></p>
  <p>Волна: <span id="finalWave">1</span></p>
  <p id="submitStatus"></p>
  <button id="retrySubmitBtn" style="display:none;">Отправить ещё раз</button>
  <button onclick="restart()">Заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

// ---------- Состояние игры ----------
let keys = {};
let player, bullets, enemies, particles, enemyBullets;
let score, wave, spawnTimer, gameOver;
let waveEnemiesTotal, waveEnemiesSpawned, waveBreakTimer;
let plane, pickups;
let paused = false;
let started = false;      // игра стартует только после ввода имени
let runTime = 0;          // сколько секунд игрок реально играл (без пауз)
let playerName = '';
let scoreSubmitted = false;
let shakeIntensity = 0;

// Все скорости в "пикселях/секунду" — одинаковая скорость независимо от FPS устройства
const PLAYER_SPEED = 280;
const PLAYER_SIZE = 22;
const BULLET_SPEED = 550;
const FIRE_RATE = 0.2;
const ENEMY_BASE_SPEED = 100;
const ENEMY_SIZE = 20;
const JOY_RADIUS = 55;
const CONTACT_DPS = 30;
const PARTICLE_LIFE = 0.33;
const WAVE_BREAK = 1.2; // пауза перед стартом следующей волны, чтобы был видимый "выдох"
const WALL_THICKNESS = 12;
const PLANE_WAVE_INTERVAL = 3;  // самолёт прилетает раз в N волн
const PLANE_SPEED = 500;
const CRATE_SIZE = 26;
const HEAL_AMOUNT = 20;
const SCORE_BASE = 8;          // очков/сек на 1-й волне
const SCORE_WAVE_GROWTH = 1.6; // на сколько очков/сек растёт скорость счёта за каждую волну
const HIT_FLASH_DURATION = 0.08; // сколько секунд враг светится белым при уроне
const SHAKE_DECAY = 18;          // как быстро затухает тряска экрана
const DAMAGE_SOUND_COOLDOWN = 0.35; // чтобы звук урона не спамил при долгом контакте
const SPRINT_DURATION = 0.35;    // сколько секунд длится ускорение после удара
const SPRINT_MULT = 1.7;         // во сколько раз быстрее игрок во время спринта
const SPRINT_COOLDOWN = 4;       // не чаще раза в столько секунд (диапазон 3-5 сек)

let lastTime = 0;

// ---------- Лидерборд (Supabase) ----------
// Вставьте сюда данные вашего проекта: Supabase → Project Settings → API
const SUPABASE_URL = 'https://wydvpmrmsmhjwtwaafxe.supabase.co';       // https://xxxx.supabase.co
const SUPABASE_KEY = 'sb_publishable_v73ueWUwtzxivjLLONlTlA_iKlWfPhy'; // публичный ключ (anon / publishable)

function leaderboardConfigured() {
  return SUPABASE_URL.startsWith('https://') && !SUPABASE_KEY.startsWith('PASTE');
}

function supabaseHeaders() {
  const h = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith('eyJ')) h['Authorization'] = 'Bearer ' + SUPABASE_KEY; // старый формат ключа (JWT)
  return h;
}

async function submitScore() {
  const statusEl = document.getElementById('submitStatus');
  const retryBtn = document.getElementById('retrySubmitBtn');
  retryBtn.style.display = 'none';
  if (scoreSubmitted) return;
  if (!leaderboardConfigured()) {
    statusEl.textContent = '';
    return;
  }
  statusEl.textContent = 'Отправляем результат...';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/submit_score', {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify({
        p_name: playerName,
        p_score: Math.floor(score),
        p_wave: wave,
        p_duration: Math.round(runTime * 10) / 10
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    scoreSubmitted = true;
    statusEl.textContent = 'Результат сохранён ✓';
  } catch (e) {
    statusEl.textContent = 'Не удалось отправить результат. Проверьте интернет.';
    retryBtn.style.display = 'inline-block';
  }
}
document.getElementById('retrySubmitBtn').addEventListener('click', submitScore);

// ---------- Экран ввода имени ----------
const startOverlay = document.getElementById('startOverlay');
const nameInput = document.getElementById('nameInput');
try { nameInput.value = localStorage.getItem('playerName') || ''; } catch (e) { /* хранилище недоступно */ }

function startGame() {
  const name = nameInput.value.trim().replace(/\s+/g, ' ');
  if (name.length < 2) {
    document.getElementById('nameError').textContent = 'Введите имя (минимум 2 символа)';
    return;
  }
  playerName = name;
  try { localStorage.setItem('playerName', name); } catch (e) { /* не страшно */ }
  started = true;
  lastTime = 0;
  startOverlay.style.display = 'none';
}
document.getElementById('startBtn').addEventListener('click', startGame);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

// ---------- Звук (простые бипы через Web Audio — заглушка вместо сэмплов) ----------
let audioCtx = null;
let soundEnabled = true;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* нет поддержки — молча игнорируем */ }
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
window.addEventListener('pointerdown', ensureAudio);
window.addEventListener('keydown', ensureAudio);

function beep(freq, duration, type, volume) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = volume != null ? volume : 0.12;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  osc.start(now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.stop(now + duration);
}
function sfxShoot()     { beep(760, 0.045, 'square', 0.04); }
function sfxHit()       { beep(180, 0.06, 'sawtooth', 0.07); }
function sfxDeath()     { beep(110, 0.14, 'sawtooth', 0.09); }
function sfxPickup()    { beep(700, 0.16, 'sine', 0.10); }
function sfxDamage()    { beep(90, 0.12, 'square', 0.10); }
function sfxEnemyShot() { beep(320, 0.05, 'triangle', 0.05); }

function triggerShake(amount) {
  shakeIntensity = Math.max(shakeIntensity, amount);
}

// ---------- Темы/стилистика ----------
// Вся "визуальная личность" игры вынесена сюда. Пока это только цвета и подписи
// (заглушки вместо арта) — когда появятся PNG под конкретную тему, сюда же
// добавятся пути к спрайтам, и вся остальная логика останется без изменений.
const THEMES = {
  desert: {
    label: 'Пустыня',
    enemyLabel: 'Монстр',
    playerLabel: 'Солдат',
    playerColor: '#4ecdc4',
    enemyHueBase: 350,
    bgColor: '#0d1117',
    gridColor: '#1e2030',
    wallColor: '#e94560',
    crateColor: '#7CFC00'
  },
  office: {
    label: 'Офис',
    enemyLabel: 'Коллега',
    playerLabel: 'Новичок',
    playerColor: '#f4a261',
    enemyHueBase: 210,
    bgColor: '#1a1a2e',
    gridColor: '#2a2a44',
    wallColor: '#457b9d',
    crateColor: '#ffd93d'
  }
};
let currentTheme = 'desert';

function switchTheme(name) {
  if (!THEMES[name]) return;
  currentTheme = name;
  canvas.style.background = THEMES[name].bgColor;
  document.querySelectorAll('#themeButtons button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === name);
  });
}

// ---------- Типы врагов ----------
// Каждый тип — набор множителей поверх базовых характеристик + форма для
// визуального отличия без арта. hueOffset красит их по-разному поверх темы.
const ENEMY_TYPES = {
  chaser:  { hpBase: 2,  sizeMult: 1,    speedMult: 1,   contactDpsMult: 1,   minWave: 1,  hueOffset: 0,   shape: 'square' },
  runner:  { hpBase: 1,  sizeMult: 0.7,  speedMult: 1.8, contactDpsMult: 0.6, minWave: 3,  hueOffset: 60,  shape: 'diamond' },
  giant:   { hpBase: 10, sizeMult: 2.1,  speedMult: 0.45,contactDpsMult: 2.2, minWave: 10, hueOffset: 140, shape: 'circle' },
  shooter: { hpBase: 2,  sizeMult: 0.9,  speedMult: 0.8, contactDpsMult: 0.7, minWave: 7,  hueOffset: 210, shape: 'triangle',
             ranged: true, shootRange: 320, shootInterval: 1.8, bulletSpeed: 260, bulletDamage: 8 }
};

function pickEnemyType() {
  const available = Object.keys(ENEMY_TYPES).filter(k => wave >= ENEMY_TYPES[k].minWave);
  return available[Math.floor(Math.random() * available.length)];
}

// сколько врагов нужно зачистить за волну, чтобы началась следующая
function enemiesPerWave(w) {
  return Math.min(24, 4 + w * 2);
}

// ---------- Мир и камера ----------
let WORLD_W, WORLD_H;
let camera = { x: 0, y: 0 };

function updateCamera() {
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
  camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
  camera.y = Math.max(0, Math.min(WORLD_H - H, camera.y));
}

// ---------- Адаптивный размер экрана ----------
function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  if (player && WORLD_W) {
    player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
    player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
    updateCamera();
  }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

function init() {
  resizeCanvas();
  switchTheme(currentTheme);
  WORLD_W = Math.max(2400, Math.round(W * 1.8));
  WORLD_H = Math.max(1800, Math.round(H * 1.8));
  player = { x: WORLD_W/2, y: WORLD_H/2, hp: 100, maxHp: 100, fireCooldown: 0, sprintTimer: 0, sprintCooldown: 0 };
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  score = 0;
  runTime = 0;
  scoreSubmitted = false;
  document.getElementById('submitStatus').textContent = '';
  document.getElementById('retrySubmitBtn').style.display = 'none';
  wave = 1;
  spawnTimer = 0;
  waveEnemiesTotal = enemiesPerWave(wave);
  waveEnemiesSpawned = 0;
  waveBreakTimer = 0;
  gameOver = false;
  paused = false;
  shakeIntensity = 0;
  plane = null;
  pickups = [];
  updateCamera();
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('pauseOverlay').style.display = 'none';
  document.getElementById('settingsOverlay').style.display = 'none';
}

// ---------- Ввод: клавиатура (для теста на компе) ----------
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- Ввод: виртуальный джойстик (тач) ----------
let joystick = { active: false, id: null, baseX: 0, baseY: 0, knobX: 0, knobY: 0, dx: 0, dy: 0 };

function touchPos(t) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) * (W / rect.width),
    y: (t.clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (joystick.active) return;
  const t = e.changedTouches[0];
  const p = touchPos(t);
  joystick.active = true;
  joystick.id = t.identifier;
  joystick.baseX = p.x; joystick.baseY = p.y;
  joystick.knobX = p.x; joystick.knobY = p.y;
  joystick.dx = 0; joystick.dy = 0;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystick.active) return;
  let t = null;
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) { t = touch; break; }
  }
  if (!t) return;
  const p = touchPos(t);
  let ddx = p.x - joystick.baseX;
  let ddy = p.y - joystick.baseY;
  const dist = Math.hypot(ddx, ddy);
  if (dist > JOY_RADIUS) { ddx = ddx / dist * JOY_RADIUS; ddy = ddy / dist * JOY_RADIUS; }
  joystick.knobX = joystick.baseX + ddx;
  joystick.knobY = joystick.baseY + ddy;
  joystick.dx = ddx / JOY_RADIUS;
  joystick.dy = ddy / JOY_RADIUS;
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) {
      joystick.active = false; joystick.dx = 0; joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

function restart() {
  lastTime = 0;
  init();
  requestAnimationFrame(loop);
}

// ---------- Пауза и настройки ----------
const pauseBtn = document.getElementById('pauseBtn');
const pauseOverlay = document.getElementById('pauseOverlay');
const settingsOverlay = document.getElementById('settingsOverlay');

function openPause() {
  if (gameOver || !started) return;
  paused = true;
  pauseOverlay.style.display = 'flex';
}
function closePause() {
  paused = false;
  pauseOverlay.style.display = 'none';
}
pauseBtn.addEventListener('click', () => { ensureAudio(); openPause(); });
document.getElementById('resumeBtn').addEventListener('click', closePause);
document.getElementById('restartFromPauseBtn').addEventListener('click', () => {
  pauseOverlay.style.display = 'none';
  restart();
});
document.getElementById('openSettingsBtn').addEventListener('click', () => {
  pauseOverlay.style.display = 'none';
  settingsOverlay.style.display = 'flex';
});
document.getElementById('backToPauseBtn').addEventListener('click', () => {
  settingsOverlay.style.display = 'none';
  pauseOverlay.style.display = 'flex';
});
document.querySelectorAll('#themeButtons button').forEach(btn => {
  btn.addEventListener('click', () => switchTheme(btn.dataset.theme));
});
document.getElementById('soundToggle').addEventListener('change', e => {
  soundEnabled = e.target.checked;
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (settingsOverlay.style.display === 'flex') {
      settingsOverlay.style.display = 'none';
      pauseOverlay.style.display = 'flex';
    } else if (paused) {
      closePause();
    } else {
      openPause();
    }
  }
});

// ---------- Самолёт со снабжением ----------
function spawnPlane() {
  const horizontal = Math.random() < 0.5;
  let startX, startY, endX, endY;
  const margin = 60;
  if (horizontal) {
    const y = margin + Math.random() * (WORLD_H - margin*2);
    const leftToRight = Math.random() < 0.5;
    startX = leftToRight ? -margin : WORLD_W + margin;
    endX = leftToRight ? WORLD_W + margin : -margin;
    startY = y; endY = y;
  } else {
    const x = margin + Math.random() * (WORLD_W - margin*2);
    const topToBottom = Math.random() < 0.5;
    startY = topToBottom ? -margin : WORLD_H + margin;
    endY = topToBottom ? WORLD_H + margin : -margin;
    startX = x; endX = x;
  }
  const dist = Math.hypot(endX - startX, endY - startY);
  const duration = dist / PLANE_SPEED;
  const dropProgress = 0.4 + Math.random() * 0.2;
  plane = {
    startX, startY, endX, endY, duration,
    elapsed: 0,
    x: startX, y: startY,
    dropProgress,
    dropped: false,
    dropX: startX + (endX - startX) * dropProgress,
    dropY: startY + (endY - startY) * dropProgress
  };
}

function collectPickup(p) {
  if (p.type === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + HEAL_AMOUNT);
  }
  // сюда позже добавятся типы 'ammo' и 'upgrade', когда появятся сами системы
  spawnParticles(p.x, p.y, THEMES[currentTheme].crateColor);
  sfxPickup();
}

// ---------- Спавн врагов ----------
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  if (side === 0) { x = margin; y = margin + Math.random() * (WORLD_H - margin*2); }
  else if (side === 1) { x = WORLD_W - margin; y = margin + Math.random() * (WORLD_H - margin*2); }
  else if (side === 2) { x = margin + Math.random() * (WORLD_W - margin*2); y = margin; }
  else { x = margin + Math.random() * (WORLD_W - margin*2); y = WORLD_H - margin; }

  const typeKey = pickEnemyType();
  const type = ENEMY_TYPES[typeKey];
  const speedMult = 1 + (wave - 1) * 0.12;
  const hueBase = THEMES[currentTheme].enemyHueBase;
  enemies.push({
    type: typeKey,
    x, y,
    hp: type.hpBase + Math.floor(wave / 3),
    speed: ENEMY_BASE_SPEED * speedMult * type.speedMult,
    size: ENEMY_SIZE * type.sizeMult,
    contactDps: CONTACT_DPS * type.contactDpsMult,
    color: `hsl(${(hueBase + type.hueOffset - wave * 5 + 360) % 360}, 70%, 55%)`,
    hitFlash: 0,
    fireTimer: type.ranged ? Math.random() * type.shootInterval : 0
  });
}

// ---------- Обновление ----------
function update(dt) {
  if (gameOver) return;

  runTime += dt;
  // очки капают каждую секунду просто за то, что вы живы — не за фраги
  score += (SCORE_BASE + (wave - 1) * SCORE_WAVE_GROWTH) * dt;

  // затухание тряски экрана
  shakeIntensity = Math.max(0, shakeIntensity - SHAKE_DECAY * dt);

  // --- движение игрока: джойстик (аналог) или клавиатура (цифровое) ---
  let dx = 0, dy = 0;
  if (joystick.active) {
    dx = joystick.dx; dy = joystick.dy;
  } else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
  }
  // мини-спринт: если недавно получили урон, двигаемся быстрее — шанс вырваться
  player.sprintTimer = Math.max(0, player.sprintTimer - dt);
  player.sprintCooldown = Math.max(0, player.sprintCooldown - dt);
  const sprintMult = player.sprintTimer > 0 ? SPRINT_MULT : 1;

  player.x += dx * PLAYER_SPEED * sprintMult * dt;
  player.y += dy * PLAYER_SPEED * sprintMult * dt;
  player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
  player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
  updateCamera();

  // --- автострельба по ближайшему врагу ---
  player.fireCooldown -= dt;
  if (player.fireCooldown <= 0 && enemies.length > 0) {
    let nearest = enemies[0], nd = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < nd) { nd = d; nearest = e; }
    }
    const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED
    });
    player.fireCooldown = FIRE_RATE;
    sfxShoot();
  }

  // --- пули игрока ---
  bullets = bullets.filter(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    return b.x > -10 && b.x < WORLD_W+10 && b.y > -10 && b.y < WORLD_H+10;
  });

  // --- враги: движение (с учётом типа) + стрельба у дальнобойных ---
  for (const e of enemies) {
    const type = ENEMY_TYPES[e.type];
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    const dist = Math.hypot(player.x - e.x, player.y - e.y);

    if (type.ranged) {
      if (dist > type.shootRange * 0.85) {
        e.x += Math.cos(angle) * e.speed * dt;
        e.y += Math.sin(angle) * e.speed * dt;
      } else if (dist < type.shootRange * 0.5) {
        e.x -= Math.cos(angle) * e.speed * dt;
        e.y -= Math.sin(angle) * e.speed * dt;
      }
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && dist < type.shootRange) {
        enemyBullets.push({
          x: e.x, y: e.y,
          vx: Math.cos(angle) * type.bulletSpeed,
          vy: Math.sin(angle) * type.bulletSpeed,
          damage: type.bulletDamage
        });
        e.fireTimer = type.shootInterval;
        sfxEnemyShot();
      }
    } else {
      e.x += Math.cos(angle) * e.speed * dt;
      e.y += Math.sin(angle) * e.speed * dt;
    }
  }

  // --- пули врагов: полёт + попадание по игроку ---
  let damagedThisFrame = false;
  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (Math.hypot(b.x - player.x, b.y - player.y) < PLAYER_SIZE/2 + 4) {
      player.hp -= b.damage;
      damagedThisFrame = true;
      if (player.sprintCooldown <= 0) {
        player.sprintTimer = SPRINT_DURATION;
        player.sprintCooldown = SPRINT_COOLDOWN;
      }
      triggerShake(8);
      return false;
    }
    return b.x > -10 && b.x < WORLD_W+10 && b.y > -10 && b.y < WORLD_H+10;
  });

  // --- коллизии: пуля игрока — враг (с отбрасыванием и вспышкой) ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.size/2 + 4) {
        bullets.splice(j, 1);
        e.hp--;
        e.hitFlash = HIT_FLASH_DURATION;
        spawnParticles(e.x, e.y, e.color);
        sfxHit();
        if (e.hp <= 0) {
          enemies.splice(i, 1);
          sfxDeath();
        }
        break;
      }
    }
  }

  // --- коллизии: враг-игрок (контактный урон) ---
  for (const e of enemies) {
    if (Math.hypot(e.x - player.x, e.y - player.y) < e.size/2 + PLAYER_SIZE/2) {
      player.hp -= e.contactDps * dt;
      damagedThisFrame = true;
      if (player.sprintCooldown <= 0) {
        player.sprintTimer = SPRINT_DURATION;
        player.sprintCooldown = SPRINT_COOLDOWN;
      }
      triggerShake(3);
    }
  }

  if (damagedThisFrame) {
    if (!update.dmgCooldown || update.dmgCooldown <= 0) {
      sfxDamage();
      update.dmgCooldown = DAMAGE_SOUND_COOLDOWN;
    }
  }
  update.dmgCooldown = Math.max(0, (update.dmgCooldown || 0) - dt);

  if (player.hp <= 0) {
    gameOver = true;
    document.getElementById('finalScore').textContent = Math.floor(score);
    document.getElementById('finalWave').textContent = wave;
    document.getElementById('gameover').style.display = 'block';
    submitScore();
  }

  // --- частицы ---
  particles = particles.filter(p => {
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
    return p.life > 0;
  });

  // --- спавн волнами ---
  // --- спавн волны: не начинаем следующую, пока текущая не зачищена целиком ---
  if (waveBreakTimer > 0) {
    waveBreakTimer -= dt;
  } else if (waveEnemiesSpawned < waveEnemiesTotal) {
    spawnTimer += dt;
    const spawnInterval = Math.max(0.25, 1 - wave * 0.05);
    if (spawnTimer > spawnInterval) {
      spawnEnemy();
      waveEnemiesSpawned++;
      spawnTimer = 0;
    }
  } else if (enemies.length === 0) {
    // весь пул волны выбит подчистую — можно идти дальше
    wave++;
    waveEnemiesTotal = enemiesPerWave(wave);
    waveEnemiesSpawned = 0;
    spawnTimer = 0;
    waveBreakTimer = WAVE_BREAK;
    // самолёт прилетает раз в PLANE_WAVE_INTERVAL волн, стартуя новую волну
    if (!plane && wave % PLANE_WAVE_INTERVAL === 0) {
      spawnPlane();
    }
  }

  // --- самолёт со снабжением: летит, если запущен (см. триггер выше) ---
  if (plane) {
    plane.elapsed += dt;
    const progress = plane.elapsed / plane.duration;
    plane.x = plane.startX + (plane.endX - plane.startX) * progress;
    plane.y = plane.startY + (plane.endY - plane.startY) * progress;
    if (!plane.dropped && progress >= plane.dropProgress) {
      plane.dropped = true;
      pickups.push({ x: plane.dropX, y: plane.dropY, type: 'heal', bobPhase: 0 });
    }
    if (progress >= 1) {
      plane = null;
    }
  }

  // --- ящики: анимация покачивания + подбор игроком ---
  for (const p of pickups) p.bobPhase += dt * 3;
  pickups = pickups.filter(p => {
    if (Math.hypot(p.x - player.x, p.y - player.y) < CRATE_SIZE/2 + PLAYER_SIZE/2) {
      collectPickup(p);
      return false;
    }
    return true;
  });

  // --- UI ---
  document.getElementById('hp').textContent = Math.max(0, Math.ceil(player.hp));
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('wave').textContent = wave;
  document.getElementById('remaining').textContent = (waveEnemiesTotal - waveEnemiesSpawned) + enemies.length;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: PARTICLE_LIFE, color
    });
  }
}

// ---------- Отрисовка формы врага по типу (заглушки вместо спрайтов) ----------
function drawEnemyShape(e) {
  const type = ENEMY_TYPES[e.type];
  const s = e.size;
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (type.shape === 'diamond') {
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-s/2, -s/2, s, s);
  } else if (type.shape === 'circle') {
    ctx.beginPath();
    ctx.arc(0, 0, s/2, 0, Math.PI*2);
    ctx.fill();
  } else if (type.shape === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, -s/2);
    ctx.lineTo(s/2, s/2);
    ctx.lineTo(-s/2, s/2);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillRect(-s/2, -s/2, s, s);
  }
  ctx.restore();
}

// ---------- Отрисовка ----------
function draw() {
  ctx.clearRect(0, 0, W, H);

  const shakeX = shakeIntensity > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;
  const shakeY = shakeIntensity > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;

  ctx.save();
  ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

  // фон-сетка (заглушка вместо тайлов)
  ctx.strokeStyle = THEMES[currentTheme].gridColor;
  ctx.lineWidth = 1;
  const gridStartX = Math.floor(camera.x / 40) * 40;
  const gridStartY = Math.floor(camera.y / 40) * 40;
  for (let x = gridStartX; x < camera.x + W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + H); ctx.stroke();
  }
  for (let y = gridStartY; y < camera.y + H; y += 40) {
    ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + W, y); ctx.stroke();
  }

  // стены-границы мира (заглушка вместо арт-барьера)
  ctx.strokeStyle = THEMES[currentTheme].wallColor;
  ctx.lineWidth = WALL_THICKNESS;
  ctx.strokeRect(WALL_THICKNESS/2, WALL_THICKNESS/2, WORLD_W - WALL_THICKNESS, WORLD_H - WALL_THICKNESS);

  // частицы
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }

  // пули игрока
  ctx.fillStyle = '#ffd93d';
  for (const b of bullets) {
    ctx.fillRect(b.x-3, b.y-3, 6, 6);
  }

  // пули врагов
  ctx.fillStyle = '#ff5566';
  for (const b of enemyBullets) {
    ctx.fillRect(b.x-3, b.y-3, 6, 6);
  }

  // ящики со снабжением
  for (const p of pickups) {
    const bob = Math.sin(p.bobPhase) * 4;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = THEMES[currentTheme].crateColor;
    ctx.fillRect(-CRATE_SIZE/2, -CRATE_SIZE/2, CRATE_SIZE, CRATE_SIZE);
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 2;
    ctx.strokeRect(-CRATE_SIZE/2, -CRATE_SIZE/2, CRATE_SIZE, CRATE_SIZE);
    ctx.restore();
  }

  // враги — разная форма под тип
  for (const e of enemies) {
    drawEnemyShape(e);
  }

  // самолёт: тень + силуэт (заглушки)
  if (plane) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(plane.x, plane.y, 30, 16, 0, 0, Math.PI*2);
    ctx.fill();

    const angle = Math.atan2(plane.endY - plane.startY, plane.endX - plane.startX);
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#cccccc';
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-16, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-16, 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // игрок
  ctx.fillStyle = THEMES[currentTheme].playerColor;
  ctx.fillRect(player.x - PLAYER_SIZE/2, player.y - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(player.x-6, player.y-4, 3, 3);
  ctx.fillRect(player.x+3, player.y-4, 3, 3);

  ctx.restore();

  // виртуальный джойстик — в координатах экрана, камера/тряска на него не влияют
  if (joystick.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, JOY_RADIUS, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(joystick.knobX, joystick.knobY, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  dt = Math.min(dt, 0.05);

  if (!paused && started) update(dt);
  draw();
  if (!gameOver) requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
