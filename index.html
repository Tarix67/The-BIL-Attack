<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Prototype</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d1117;
    font-family: 'Courier New', monospace;
    color: #eee;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #ui {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-size: clamp(13px, 3.5vw, 18px);
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }
  canvas {
    image-rendering: pixelated;
    display: block;
    background: #0d1117;
    touch-action: none;
  }
  #gameover {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
    text-shadow: 2px 2px 0 #000;
    z-index: 10;
    width: 80%;
  }
  #gameover h1 { color: #e94560; font-size: clamp(28px, 8vw, 40px); margin-bottom: 10px; }
  #gameover p { font-size: clamp(16px, 4vw, 20px); }
  #gameover button {
    background: #e94560; color: white; border: none;
    padding: 14px 28px; font-size: clamp(16px, 4vw, 18px); cursor: pointer;
    font-family: inherit; border-radius: 4px;
    touch-action: manipulation;
  }
</style>
</head>
<body>

<div id="ui">
  <span>HP: <span id="hp">100</span></span>
  <span>Счёт: <span id="score">0</span></span>
  <span>Волна: <span id="wave">1</span></span>
</div>

<canvas id="game"></canvas>

<div id="gameover">
  <h1>ТЫ ПОЙМАН</h1>
  <p>Счёт: <span id="finalScore">0</span></p>
  <button onclick="restart()">Заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

// ---------- Состояние игры ----------
let keys = {};
let player, bullets, enemies, particles;
let score, wave, spawnTimer, waveTimer, gameOver;
let plane, pickups, supplyTimer;

// Все скорости теперь в "пикселях/секунду", а не "за кадр" —
// это делает игру одинаковой по скорости независимо от FPS устройства
const PLAYER_SPEED = 280;      // было 192 — прибавили ходу
const PLAYER_SIZE = 22;
const BULLET_SPEED = 550;      // было 420
const FIRE_RATE = 0.2;         // было 0.25 — стреляем чуть чаще
const ENEMY_BASE_SPEED = 100;  // было 72
const ENEMY_SIZE = 20;
const JOY_RADIUS = 55;
const CONTACT_DPS = 30;        // урона в секунду при контакте с врагом (было 0.5/кадр)
const PARTICLE_LIFE = 0.33;    // секунд жизни частицы (было 20 кадров)
const WAVE_DURATION = 10;      // секунд на волну (было 600 кадров)
const WALL_THICKNESS = 12;
const SUPPLY_INTERVAL = 25;    // секунд между пролётами самолёта
const PLANE_SPEED = 500;       // пикселей/сек, летит быстро
const CRATE_SIZE = 26;
const HEAL_AMOUNT = 35;        // сколько HP восстанавливает аптечка
const SCORE_PER_SECOND = 12;   // очки начисляются за выживание, не за убийства

let lastTime = 0;

// ---------- Темы/стилистика ----------
// Вся "визуальная личность" игры вынесена сюда. Пока это только цвета и подписи
// (заглушки вместо арта) — когда появятся PNG под конкретную тему, сюда же
// добавятся пути к спрайтам (player, enemy, background, wall, plane), и вся
// остальная логика останется без изменений — просто будет брать картинки
// вместо fillRect/цвета.
const THEMES = {
  desert: {
    label: 'Пустыня',
    enemyLabel: 'Монстр',
    playerLabel: 'Солдат',
    playerColor: '#4ecdc4',
    enemyHueBase: 350,      // базовый оттенок врагов по волнам (текущая палитра)
    bgColor: '#0d1117',
    gridColor: '#1e2030',
    wallColor: '#e94560',
    crateColor: '#7CFC00'
  },
  office: {
    label: 'Офис',
    enemyLabel: 'Коллега',
    playerLabel: 'Новичок',
    playerColor: '#f4a261',
    enemyHueBase: 210,
    bgColor: '#1a1a2e',
    gridColor: '#2a2a44',
    wallColor: '#457b9d',
    crateColor: '#ffd93d'
  }
};
let currentTheme = 'desert';

function switchTheme(name) {
  if (!THEMES[name]) return;
  currentTheme = name;
  canvas.style.background = THEMES[name].bgColor;
}

// Временная горячая клавиша T — переключает тему для превью,
// пока нет настоящего экрана настроек. Уберём/заменим на UI позже.
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 't') {
    switchTheme(currentTheme === 'desert' ? 'office' : 'desert');
  }
});

// ---------- Мир и камера ----------
// Мир больше экрана — игрок бегает по нему, камера следует, есть стены-границы.
let WORLD_W, WORLD_H;
let camera = { x: 0, y: 0 };

function updateCamera() {
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
  camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
  camera.y = Math.max(0, Math.min(WORLD_H - H, camera.y));
}

// ---------- Адаптивный размер экрана ----------
function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  if (player && WORLD_W) {
    player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
    player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
    updateCamera();
  }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

function init() {
  resizeCanvas();
  switchTheme(currentTheme);
  // мир всегда заметно больше экрана — есть куда бежать до стены
  WORLD_W = Math.max(2400, Math.round(W * 1.8));
  WORLD_H = Math.max(1800, Math.round(H * 1.8));
  player = { x: WORLD_W/2, y: WORLD_H/2, hp: 100, maxHp: 100, fireCooldown: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  wave = 1;
  spawnTimer = 0;
  waveTimer = 0;
  gameOver = false;
  plane = null;
  pickups = [];
  supplyTimer = SUPPLY_INTERVAL - 8; // первый самолёт прилетит чуть раньше, чем обычный интервал
  updateCamera();
  document.getElementById('gameover').style.display = 'none';
}

// ---------- Ввод: клавиатура (для теста на компе) ----------
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- Ввод: виртуальный джойстик (тач) ----------
let joystick = { active: false, id: null, baseX: 0, baseY: 0, knobX: 0, knobY: 0, dx: 0, dy: 0 };

function touchPos(t) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) * (W / rect.width),
    y: (t.clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (joystick.active) return; // одна точка управления за раз
  const t = e.changedTouches[0];
  const p = touchPos(t);
  joystick.active = true;
  joystick.id = t.identifier;
  joystick.baseX = p.x; joystick.baseY = p.y;
  joystick.knobX = p.x; joystick.knobY = p.y;
  joystick.dx = 0; joystick.dy = 0;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystick.active) return;
  let t = null;
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) { t = touch; break; }
  }
  if (!t) return;
  const p = touchPos(t);
  let ddx = p.x - joystick.baseX;
  let ddy = p.y - joystick.baseY;
  const dist = Math.hypot(ddx, ddy);
  if (dist > JOY_RADIUS) { ddx = ddx / dist * JOY_RADIUS; ddy = ddy / dist * JOY_RADIUS; }
  joystick.knobX = joystick.baseX + ddx;
  joystick.knobY = joystick.baseY + ddy;
  joystick.dx = ddx / JOY_RADIUS;
  joystick.dy = ddy / JOY_RADIUS;
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) {
      joystick.active = false; joystick.dx = 0; joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

function restart() {
  lastTime = 0;
  init();
  requestAnimationFrame(loop);
}

// ---------- Самолёт со снабжением ----------
function spawnPlane() {
  // летит по прямой через весь мир, с одного случайного края до противоположного
  const horizontal = Math.random() < 0.5;
  let startX, startY, endX, endY;
  const margin = 60;
  if (horizontal) {
    const y = margin + Math.random() * (WORLD_H - margin*2);
    const leftToRight = Math.random() < 0.5;
    startX = leftToRight ? -margin : WORLD_W + margin;
    endX = leftToRight ? WORLD_W + margin : -margin;
    startY = y; endY = y;
  } else {
    const x = margin + Math.random() * (WORLD_W - margin*2);
    const topToBottom = Math.random() < 0.5;
    startY = topToBottom ? -margin : WORLD_H + margin;
    endY = topToBottom ? WORLD_H + margin : -margin;
    startX = x; endX = x;
  }
  const dist = Math.hypot(endX - startX, endY - startY);
  const duration = dist / PLANE_SPEED;
  // ящик падает где-то в середине пролёта (40%-60% пути), чтобы точка сброса была внутри карты
  const dropProgress = 0.4 + Math.random() * 0.2;
  plane = {
    startX, startY, endX, endY, duration,
    elapsed: 0,
    x: startX, y: startY,
    dropProgress,
    dropped: false,
    dropX: startX + (endX - startX) * dropProgress,
    dropY: startY + (endY - startY) * dropProgress
  };
}

function collectPickup(p) {
  if (p.type === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + HEAL_AMOUNT);
  }
  // сюда позже добавятся типы 'ammo' и 'upgrade', когда появятся сами системы
  spawnParticles(p.x, p.y, THEMES[currentTheme].crateColor);
}
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  if (side === 0) { x = margin; y = margin + Math.random() * (WORLD_H - margin*2); }
  else if (side === 1) { x = WORLD_W - margin; y = margin + Math.random() * (WORLD_H - margin*2); }
  else if (side === 2) { x = margin + Math.random() * (WORLD_W - margin*2); y = margin; }
  else { x = margin + Math.random() * (WORLD_W - margin*2); y = WORLD_H - margin; }

  const speedMult = 1 + (wave - 1) * 0.12;
  const hueBase = THEMES[currentTheme].enemyHueBase;
  enemies.push({
    x, y,
    hp: 2 + Math.floor(wave / 3),
    speed: ENEMY_BASE_SPEED * speedMult,
    color: `hsl(${hueBase - wave * 5}, 70%, 55%)`
  });
}

// ---------- Обновление ----------
function update(dt) {
  if (gameOver) return;

  // очки капают каждую секунду просто за то, что вы живы — не за фраги
  score += SCORE_PER_SECOND * dt;

  // --- движение игрока: джойстик (аналог) или клавиатура (цифровое) ---
  let dx = 0, dy = 0;  if (joystick.active) {
    dx = joystick.dx; dy = joystick.dy; // уже в диапазоне [-1, 1]
  } else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
  }
  player.x += dx * PLAYER_SPEED * dt;
  player.y += dy * PLAYER_SPEED * dt;
  player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
  player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
  updateCamera();

  // --- автострельба по ближайшему врагу ---
  player.fireCooldown -= dt;
  if (player.fireCooldown <= 0 && enemies.length > 0) {
    let nearest = enemies[0], nd = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < nd) { nd = d; nearest = e; }
    }
    const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED
    });
    player.fireCooldown = FIRE_RATE;
  }

  // --- пули ---
  bullets = bullets.filter(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    return b.x > -10 && b.x < WORLD_W+10 && b.y > -10 && b.y < WORLD_H+10;
  });

  // --- враги: движение к игроку ---
  for (const e of enemies) {
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed * dt;
    e.y += Math.sin(angle) * e.speed * dt;
  }

  // --- коллизии: пуля-враг ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < ENEMY_SIZE/2 + 4) {
        bullets.splice(j, 1);
        e.hp--;
        spawnParticles(e.x, e.y, e.color);
        if (e.hp <= 0) {
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // --- коллизии: враг-игрок ---
  for (const e of enemies) {
    if (Math.hypot(e.x - player.x, e.y - player.y) < ENEMY_SIZE/2 + PLAYER_SIZE/2) {
      player.hp -= CONTACT_DPS * dt;
    }
  }
  if (player.hp <= 0) {
    gameOver = true;
    document.getElementById('finalScore').textContent = Math.floor(score);
    document.getElementById('gameover').style.display = 'block';
  }

  // --- частицы ---
  particles = particles.filter(p => {
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
    return p.life > 0;
  });

  // --- спавн волнами ---
  spawnTimer += dt;
  const spawnInterval = Math.max(0.25, 1 - wave * 0.05);
  if (spawnTimer > spawnInterval) {
    spawnEnemy();
    spawnTimer = 0;
  }
  waveTimer += dt;
  if (waveTimer > WAVE_DURATION) {
    wave++;
    waveTimer = 0;
  }

  // --- самолёт со снабжением ---
  supplyTimer += dt;
  if (!plane && supplyTimer > SUPPLY_INTERVAL) {
    spawnPlane();
    supplyTimer = 0;
  }
  if (plane) {
    plane.elapsed += dt;
    const progress = plane.elapsed / plane.duration;
    plane.x = plane.startX + (plane.endX - plane.startX) * progress;
    plane.y = plane.startY + (plane.endY - plane.startY) * progress;
    if (!plane.dropped && progress >= plane.dropProgress) {
      plane.dropped = true;
      pickups.push({ x: plane.dropX, y: plane.dropY, type: 'heal', bobPhase: 0 });
    }
    if (progress >= 1) {
      plane = null;
    }
  }

  // --- ящики: анимация покачивания + подбор игроком ---
  for (const p of pickups) p.bobPhase += dt * 3;
  pickups = pickups.filter(p => {
    if (Math.hypot(p.x - player.x, p.y - player.y) < CRATE_SIZE/2 + PLAYER_SIZE/2) {
      collectPickup(p);
      return false;
    }
    return true;
  });

  // --- UI ---
  document.getElementById('hp').textContent = Math.max(0, Math.ceil(player.hp));
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('wave').textContent = wave;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: PARTICLE_LIFE, color
    });
  }
}

// ---------- Отрисовка ----------
function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // фон-сетка (заглушка вместо тайлов) — рисуем только видимую часть мира, не весь мир целиком
  ctx.strokeStyle = THEMES[currentTheme].gridColor;
  ctx.lineWidth = 1;
  const gridStartX = Math.floor(camera.x / 40) * 40;
  const gridStartY = Math.floor(camera.y / 40) * 40;
  for (let x = gridStartX; x < camera.x + W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + H); ctx.stroke();
  }
  for (let y = gridStartY; y < camera.y + H; y += 40) {
    ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + W, y); ctx.stroke();
  }

  // стены-границы мира (заглушка вместо арт-барьера)
  ctx.strokeStyle = THEMES[currentTheme].wallColor;
  ctx.lineWidth = WALL_THICKNESS;
  ctx.strokeRect(WALL_THICKNESS/2, WALL_THICKNESS/2, WORLD_W - WALL_THICKNESS, WORLD_H - WALL_THICKNESS);

  // частицы
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }

  // пули
  ctx.fillStyle = '#ffd93d';
  for (const b of bullets) {
    ctx.fillRect(b.x-3, b.y-3, 6, 6);
  }

  // ящики со снабжением (заглушка — цветной ромб, покачивается для заметности)
  for (const p of pickups) {
    const bob = Math.sin(p.bobPhase) * 4;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = THEMES[currentTheme].crateColor;
    ctx.fillRect(-CRATE_SIZE/2, -CRATE_SIZE/2, CRATE_SIZE, CRATE_SIZE);
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 2;
    ctx.strokeRect(-CRATE_SIZE/2, -CRATE_SIZE/2, CRATE_SIZE, CRATE_SIZE);
    ctx.restore();
  }

  // враги
  for (const e of enemies) {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - ENEMY_SIZE/2, e.y - ENEMY_SIZE/2, ENEMY_SIZE, ENEMY_SIZE);
  }

  // самолёт: тень на земле + силуэт самого самолёта (заглушки, потом заменим на арт)
  if (plane) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(plane.x, plane.y, 30, 16, 0, 0, Math.PI*2);
    ctx.fill();

    const angle = Math.atan2(plane.endY - plane.startY, plane.endX - plane.startX);
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#cccccc';
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-16, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-16, 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // игрок
  ctx.fillStyle = THEMES[currentTheme].playerColor;
  ctx.fillRect(player.x - PLAYER_SIZE/2, player.y - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(player.x-6, player.y-4, 3, 3);
  ctx.fillRect(player.x+3, player.y-4, 3, 3);

  ctx.restore();

  // виртуальный джойстик — рисуется в координатах экрана, камера на него не влияет
  if (joystick.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, JOY_RADIUS, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(joystick.knobX, joystick.knobY, 22, 0, Math.PI*2);
    ctx.fill();
  }
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  // реальное время с прошлого кадра, в секундах
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  // подстраховка: если вкладка была свёрнута и dt огромный — не даём игре
  // "телепортировать" всё за один скачок, ограничиваем максимальный шаг
  dt = Math.min(dt, 0.05);

  update(dt);
  draw();
  if (!gameOver) requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
