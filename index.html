<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Prototype</title>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; background:#0d1117; font-family:'Courier New',monospace; color:#eee; overflow:hidden; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #ui { position:fixed; top:10px; left:10px; right:60px; display:flex; justify-content:space-between; font-size:clamp(13px,3.5vw,18px); text-shadow:2px 2px 0 #000; pointer-events:none; z-index:5; }
  #fx { position:fixed; bottom:12px; left:10px; font-size:clamp(11px,3vw,14px); line-height:1.35; text-shadow:1px 1px 0 #000; pointer-events:none; z-index:5; }
  #toast { position:fixed; top:22%; left:0; right:0; text-align:center; font-size:clamp(18px,5vw,28px); font-weight:bold; text-shadow:2px 2px 0 #000; pointer-events:none; opacity:0; transition:opacity .25s; z-index:7; }
  canvas { image-rendering:pixelated; display:block; background:#0d1117; touch-action:none; }
  #pauseBtn { position:fixed; top:8px; right:8px; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.4); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; z-index:6; touch-action:manipulation; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:20; }
  .panel { background:#16213e; border:2px solid #4ecdc4; border-radius:10px; padding:24px 28px; min-width:240px; text-align:center; text-shadow:none; }
  .panel h2 { margin-top:0; color:#4ecdc4; font-size:clamp(20px,5vw,26px); }
  .panel button { display:block; width:100%; background:#4ecdc4; color:#0d1117; border:none; padding:12px; margin:8px 0; font-size:16px; cursor:pointer; font-family:inherit; border-radius:6px; font-weight:bold; touch-action:manipulation; }
  .panel button.secondary { background:#2a2a44; color:#eee; }
  .settings-row { display:flex; justify-content:space-between; align-items:center; margin:14px 0; gap:10px; }
  .theme-buttons { display:flex; gap:6px; }
  .theme-buttons button { margin:0; padding:8px 10px; font-size:13px; width:auto; }
  .theme-buttons button.active { outline:3px solid #ffd93d; }
  #gameover { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; display:none; text-shadow:2px 2px 0 #000; z-index:10; width:80%; }
  #gameover h1 { color:#e94560; font-size:clamp(28px,8vw,40px); margin-bottom:10px; }
  #gameover p { font-size:clamp(16px,4vw,20px); }
  #gameover button { background:#e94560; color:#fff; border:none; padding:14px 28px; font-size:clamp(16px,4vw,18px); cursor:pointer; font-family:inherit; border-radius:4px; touch-action:manipulation; margin:4px; }
  #submitStatus { font-size:clamp(13px,3.5vw,16px) !important; min-height:1.4em; color:#ffd93d; }
  #nameInput { width:100%; box-sizing:border-box; padding:12px; margin:10px 0 4px; font-size:18px; font-family:inherit; text-align:center; border-radius:6px; border:2px solid #4ecdc4; background:#0d1117; color:#fff; -webkit-user-select:text; user-select:text; }
  #nameError { color:#e94560; font-size:13px; min-height:1.2em; margin:0 0 6px; }
</style>
</head>
<body>

<div id="ui">
  <span>HP: <span id="hp">100</span></span>
  <span>Счёт: <span id="score">0</span></span>
  <span>Волна: <span id="wave">1</span> (<span id="remaining">0</span>)</span>
</div>
<div id="fx"></div>
<div id="toast"></div>

<button id="pauseBtn">⏸</button>

<canvas id="game"></canvas>

<div id="pauseOverlay" class="overlay">
  <div class="panel">
    <h2>Пауза</h2>
    <button id="resumeBtn">Продолжить</button>
    <button id="openSettingsBtn" class="secondary">Настройки</button>
    <button id="restartFromPauseBtn" class="secondary">Начать заново</button>
  </div>
</div>

<div id="settingsOverlay" class="overlay">
  <div class="panel">
    <h2>Настройки</h2>
    <div class="settings-row">
      <span>Стилистика</span>
      <div class="theme-buttons" id="themeButtons">
        <button data-theme="desert">Пустыня</button>
        <button data-theme="office">Офис</button>
      </div>
    </div>
    <div class="settings-row">
      <span>Звук</span>
      <label><input type="checkbox" id="soundToggle" checked></label>
    </div>
    <button id="backToPauseBtn" class="secondary">Назад</button>
  </div>
</div>

<div id="startOverlay" class="overlay" style="display:flex;">
  <div class="panel">
    <h2>Введите имя</h2>
    <p style="margin:0 0 4px;font-size:13px;">Имя и фамилия, чтобы мы знали, кому вручить награду</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="Например: Иван П." autocomplete="off">
    <p id="nameError"></p>
    <button id="startBtn">Играть</button>
  </div>
</div>

<div id="gameover">
  <h1>ТЫ ПОЙМАН</h1>
  <p>Счёт: <span id="finalScore">0</span></p>
  <p>Волна: <span id="finalWave">1</span></p>
  <p id="submitStatus"></p>
  <button id="retrySubmitBtn" style="display:none;">Отправить ещё раз</button>
  <button onclick="restart()">Заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
let zoom = 1, VW, VH; // zoom < 1 на телефонах: камера "отъезжает", видно дальше

let keys = {};
let player, bullets, enemies, particles, enemyBullets, shockwaves;
let score, wave, spawnTimer, gameOver;
let waveEnemiesTotal, waveEnemiesSpawned, waveBreakTimer;
let plane, pickups, boss;
let paused = false;
let started = false;
let runTime = 0;
let playerName = '';
let scoreSubmitted = false;
let shakeIntensity = 0;
let hurtFlag = false;
let hurtFlash = 0; // 0..HURT_FLASH_MAX — насколько экран сейчас красный
let toastT = 0;
let lastFxHtml = '';

const PLAYER_SPEED = 280;
const PLAYER_SIZE = 22;
const BULLET_SPEED = 550;
const FIRE_RATE = 0.2;
const ENEMY_SIZE = 20;
const ENEMY_SPEED_GROWTH = 0.03; // на сколько доля от скорости игрока растёт за каждую волну
const JOY_RADIUS = 55;
const CONTACT_DPS = 30;
const PARTICLE_LIFE = 0.33;
const WAVE_BREAK = 1.2;
const WALL_THICKNESS = 12;
const PLANE_WAVE_INTERVAL = 3;
const PLANE_SPEED = 500;
const CRATE_SIZE = 26;
const CRATE_LIFE = 25;   // ящик исчезает, если его не подобрали за столько секунд
const HEAL_AMOUNT = 20;
const SCORE_BASE = 8;
const SCORE_WAVE_GROWTH = 1.6;
const HIT_FLASH_DURATION = 0.08;
const SHAKE_DECAY = 18;
const DAMAGE_SOUND_COOLDOWN = 0.35;
const SPRINT_DURATION = 0.35;
const SPRINT_MULT = 1.7;
const SPRINT_COOLDOWN = 4;
const HURT_FLASH_MAX = 0.3; // максимальная прозрачность красной вспышки (0.3 = "немного")
const BOSS_EVERY = 5;
const MAX_GUNS = 4;
const ENEMY_DROP_CHANCE = 0.05;
const VIEW_TARGET = 600; // сколько мировых единиц должно помещаться по МЕНЬШЕЙ стороне экрана
const MIN_ZOOM = 0.45;
const AUTO_RANGE = 380;  // дальность, на которой игрок видит цели и стреляет

let lastTime = 0;

// ---------- Спрайт аптечки ----------
// Файл лежит рядом с index.html. Пока файла нет или он не загрузился,
// рисуется зелёный квадрат с плюсом, поэтому игра не сломается.
// Это лист кадров: MEDKIT_COLS x MEDKIT_ROWS кадров, проигрываются по порядку слева направо, сверху вниз.
// Для одной статичной картинки поставьте MEDKIT_COLS = 1 и MEDKIT_ROWS = 1.
const MEDKIT_SPRITE = 'medkit_png.png';
const MEDKIT_COLS = 3;
const MEDKIT_ROWS = 4;
const MEDKIT_FPS = 6;        // кадров в секунду
const MEDKIT_DRAW_SIZE = 40; // размер одного кадра в игровых единицах (игрок = 22)
const medkitImg = new Image();
let medkitReady = false;
medkitImg.onload = () => { medkitReady = true; };
medkitImg.src = MEDKIT_SPRITE;

// ---------- Лидерборд (Supabase) ----------
const SUPABASE_URL = 'https://wydvpmrmsmhjwtwaafxe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v73ueWUwtzxivjLLONlTlA_iKlWfPhy';

function leaderboardConfigured() {
  return SUPABASE_URL.startsWith('https://') && !SUPABASE_KEY.startsWith('PASTE');
}
function supabaseHeaders() {
  const h = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith('eyJ')) h['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  return h;
}
async function submitScore() {
  const statusEl = document.getElementById('submitStatus');
  const retryBtn = document.getElementById('retrySubmitBtn');
  retryBtn.style.display = 'none';
  if (scoreSubmitted) return;
  if (!leaderboardConfigured()) { statusEl.textContent = ''; return; }
  statusEl.textContent = 'Отправляем результат...';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/submit_score', {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify({
        p_name: playerName,
        p_score: Math.floor(score),
        p_wave: wave,
        p_duration: Math.round(runTime * 10) / 10
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    scoreSubmitted = true;
    statusEl.textContent = 'Результат сохранён ✓';
  } catch (e) {
    statusEl.textContent = 'Не удалось отправить результат. Проверьте интернет.';
    retryBtn.style.display = 'inline-block';
  }
}
document.getElementById('retrySubmitBtn').addEventListener('click', submitScore);

// ---------- Экран ввода имени ----------
const startOverlay = document.getElementById('startOverlay');
const nameInput = document.getElementById('nameInput');
try { nameInput.value = localStorage.getItem('playerName') || ''; } catch (e) {}

function startGame() {
  const name = nameInput.value.trim().replace(/\s+/g, ' ');
  if (name.length < 2) {
    document.getElementById('nameError').textContent = 'Введите имя (минимум 2 символа)';
    return;
  }
  playerName = name;
  try { localStorage.setItem('playerName', name); } catch (e) {}
  started = true;
  lastTime = 0;
  startOverlay.style.display = 'none';
}
document.getElementById('startBtn').addEventListener('click', startGame);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

// ---------- Звук ----------
let audioCtx = null;
let soundEnabled = true;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
window.addEventListener('pointerdown', ensureAudio);
window.addEventListener('keydown', ensureAudio);

function beep(freq, duration, type, volume) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = volume != null ? volume : 0.12;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  osc.start(now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.stop(now + duration);
}
function sfxShoot()     { beep(760, 0.045, 'square', 0.04); }
function sfxHit()       { beep(180, 0.06, 'sawtooth', 0.07); }
function sfxDeath()     { beep(110, 0.14, 'sawtooth', 0.09); }
function sfxPickup()    { beep(700, 0.16, 'sine', 0.10); }
function sfxDamage()    { beep(90, 0.12, 'square', 0.10); }
function sfxEnemyShot() { beep(320, 0.05, 'triangle', 0.05); }
function sfxBoom()      { beep(55, 0.35, 'sawtooth', 0.14); }

function triggerShake(amount) { shakeIntensity = Math.max(shakeIntensity, amount); }

const toastEl = document.getElementById('toast');
function showToast(text, good) {
  toastEl.textContent = text;
  toastEl.style.color = good === 'neutral' ? '#ffd93d' : (good ? '#7CFC00' : '#ff6b81');
  toastEl.style.opacity = 1;
  toastT = 1.8;
}

// ---------- Темы ----------
const THEMES = {
  desert: { label: 'Пустыня', enemyLabel: 'Монстр',  playerLabel: 'Солдат',  playerColor: '#4ecdc4', enemyHueBase: 350, bgColor: '#0d1117', gridColor: '#1e2030', wallColor: '#e94560' },
  office: { label: 'Офис',    enemyLabel: 'Коллега', playerLabel: 'Новичок', playerColor: '#f4a261', enemyHueBase: 210, bgColor: '#1a1a2e', gridColor: '#2a2a44', wallColor: '#457b9d' }
};
let currentTheme = 'desert';

function switchTheme(name) {
  if (!THEMES[name]) return;
  currentTheme = name;
  canvas.style.background = THEMES[name].bgColor;
  document.querySelectorAll('#themeButtons button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === name);
  });
}

// ---------- Баффы и дебаффы (каждый временный эффект длится ~10 секунд) ----------
const EFFECT_DURATION = 10;
const GOOD = [
  { id: 'rate_up',    label: 'Скорострельность+', dur: EFFECT_DURATION },
  { id: 'speed_up',   label: 'Скорость+',         dur: EFFECT_DURATION },
  { id: 'heal',       label: 'Лечение +20' },
  { id: 'dmg_up',     label: 'Двойной урон',      dur: EFFECT_DURATION },
  { id: 'shield',     label: 'Щит',               dur: EFFECT_DURATION }
];
const BAD = [
  { id: 'rate_down',  label: 'Скорострельность−', dur: EFFECT_DURATION },
  { id: 'speed_down', label: 'Скорость−',         dur: EFFECT_DURATION },
  { id: 'hurt',       label: 'Урон −20 HP' },
  { id: 'invert',     label: 'Инверсия управления', dur: EFFECT_DURATION },
  { id: 'rage',       label: 'Враги в ярости',    dur: EFFECT_DURATION }
];
const HEAL_DEF = GOOD.find(d => d.id === 'heal');
const hasFx = id => (player.fx[id] || 0) > 0;

// Ящик из убитого врага: случайный бафф (75%) или дебафф (25%), содержимое неизвестно ("?")
function makeCrate(x, y, forceGood) {
  const good = forceGood || Math.random() < 0.75;
  const list = good ? GOOD : BAD;
  return { x, y, good, def: list[Math.floor(Math.random() * list.length)], bobPhase: 0, life: CRATE_LIFE, known: false };
}
// Ящик с самолёта: всегда аптечка, и это видно по зелёному "+"
function makeMedkit(x, y) {
  return { x, y, good: true, def: HEAL_DEF, bobPhase: 0, life: CRATE_LIFE, known: true };
}

function collectPickup(p) {
  const d = p.def;
  if (d.id === 'heal') player.hp = Math.min(player.maxHp, player.hp + HEAL_AMOUNT);
  else if (d.id === 'hurt') { player.hp -= 20; flashHurt(20); triggerShake(6); }
  else player.fx[d.id] = d.dur;
  spawnParticles(p.x, p.y, '#ffd93d');
  showToast(d.label, 'neutral');
  sfxPickup();
}

// ---------- Типы врагов ----------
// speedFrac — стартовая скорость как доля от скорости игрока; с каждой волной растёт до speedCap.
const ENEMY_TYPES = {
  chaser:  { hpBase: 2,  sizeMult: 1,   speedFrac: 0.60, speedCap: 0.95, contactDpsMult: 1,   minWave: 1,  hueOffset: 0,   shape: 'square' },
  runner:  { hpBase: 1,  sizeMult: 0.7, speedFrac: 0.95, speedCap: 1.00, contactDpsMult: 0.6, minWave: 3,  hueOffset: 60,  shape: 'diamond' },
  giant:   { hpBase: 10, sizeMult: 2.1, speedFrac: 0.30, speedCap: 0.50, contactDpsMult: 2.2, minWave: 10, hueOffset: 140, shape: 'circle',
             // прыгает рядом с игроком; при приземлении — небольшая звуковая волна
             jumper: true, jumpCd: 3.0, jumpRange: 300, jumpDur: 0.65, waveMax: 150, waveDmgBase: 3, waveDmgVar: 11 },
  shooter: { hpBase: 2,  sizeMult: 0.9, speedFrac: 0.50, speedCap: 0.80, contactDpsMult: 0.7, minWave: 7,  hueOffset: 210, shape: 'triangle',
             ranged: true, shootRange: AUTO_RANGE * 1.5, shootInterval: 1.8, bulletSpeed: 260, bulletDamage: 8 }
};
function pickEnemyType() {
  const available = Object.keys(ENEMY_TYPES).filter(k => wave >= ENEMY_TYPES[k].minWave);
  return available[Math.floor(Math.random() * available.length)];
}
function enemiesPerWave(w) { return Math.min(24, 4 + w * 2); }

// ---------- Боссы ----------
// Каждый следующий босс другой: цикл из 4 типов, дальше те же типы, но сильнее.
const BOSS_DEFS = [
  { name: 'Гренадёр', color: '#ff9f1c', shape: 'square',   attacks: ['grenade'] },
  { name: 'Прыгун',   color: '#9b5de5', shape: 'circle',   attacks: ['jump'] },
  { name: 'Метатель', color: '#00bbf9', shape: 'triangle', attacks: ['throw'] },
  { name: 'Хаос',     color: '#f15bb5', shape: 'diamond',  attacks: ['grenade', 'jump', 'throw'] }
];
const THROWS = [
  { shape: 'square',   spd: 380, r: 7,  dmg: 8,  color: '#ff5566' },
  { shape: 'triangle', spd: 260, r: 9,  dmg: 10, color: '#ffd166' },
  { shape: 'circle',   spd: 170, r: 16, dmg: 14, color: '#c77dff' }
];
const GRENADE_SPEED = 420;
const SHARD_SPEED = 300;

function spawnBoss() {
  const n = wave / BOSS_EVERY - 1;
  const def = BOSS_DEFS[n % BOSS_DEFS.length];
  const hp = 150 + n * 90;
  boss = {
    def, n, hp, maxHp: hp, size: 56, speed: 85 + n * 8, atk: 1.2, jump: null, hitFlash: 0,
    x: player.x < WORLD_W / 2 ? WORLD_W - 200 : 200,
    y: player.y < WORLD_H / 2 ? WORLD_H - 200 : 200
  };
  showToast('БОСС: ' + def.name + '!', false);
  sfxBoom();
}

function bossAttack() {
  const a = boss.def.attacks[Math.floor(Math.random() * boss.def.attacks.length)];
  const ang = Math.atan2(player.y - boss.y, player.x - boss.x);
  const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
  if (a === 'grenade') {
    // гранаты целятся с упреждением: туда, где игрок окажется к моменту падения,
    // поэтому просто кружить вокруг босса уже не получится
    const count = 1 + Math.floor(boss.n / 2); // 1 граната у первых боссов, 2 с третьего
    const flight = dist / GRENADE_SPEED;
    for (let i = 0; i < count; i++) {
      const lead = flight * (0.7 + Math.random() * 0.5);
      const tx = Math.max(40, Math.min(WORLD_W - 40, player.x + player.vx * lead));
      const ty = Math.max(40, Math.min(WORLD_H - 40, player.y + player.vy * lead));
      const aa = Math.atan2(ty - boss.y, tx - boss.x) + (i - (count - 1) / 2) * 0.28;
      const td = Math.hypot(tx - boss.x, ty - boss.y);
      enemyBullets.push({
        x: boss.x, y: boss.y, vx: Math.cos(aa) * GRENADE_SPEED, vy: Math.sin(aa) * GRENADE_SPEED,
        spd: GRENADE_SPEED, bomb: true, fuse: Math.max(200, Math.min(td, 800)), damage: 0, r: 0
      });
    }
    sfxEnemyShot();
  } else if (a === 'throw') {
    // очень широкий веер (~160°), центр — с небольшим упреждением. Кружить рядом уже не получится
    const count = 20 + Math.floor(boss.n / 2);
    const spread = Math.PI * 0.9;
    const lead = dist / 300 * 0.6;
    const cAng = Math.atan2(player.y + player.vy * lead - boss.y, player.x + player.vx * lead - boss.x);
    for (let i = 0; i < count; i++) {
      const t = THROWS[Math.floor(Math.random() * THROWS.length)];
      const aa = cAng + (count > 1 ? i / (count - 1) - 0.5 : 0) * spread + (Math.random() - 0.5) * 0.12;
      enemyBullets.push({
        x: boss.x, y: boss.y, vx: Math.cos(aa) * t.spd, vy: Math.sin(aa) * t.spd,
        damage: t.dmg, r: t.r, shape: t.shape, color: t.color
      });
    }
    sfxEnemyShot();
  } else if (a === 'jump') {
    // прыжок в ПРЕДСКАЗАННУЮ точку: куда игрок придёт, если продолжит бежать так же.
    // k и jx/jy — небольшая неточность, чтобы прыжок был "примерно" туда
    boss.jump = { t: 0, dur: 1.1, sx: boss.x, sy: boss.y, tx: boss.x, ty: boss.y,
                  k: 0.8 + Math.random() * 0.25, jx: (Math.random() - 0.5) * 80, jy: (Math.random() - 0.5) * 80 };
  }
  return a;
}

// out — массив, куда складываются осколки. НЕ добавляем их прямо в enemyBullets:
// взрыв вызывается из .filter() по этому же массиву, и всё добавленное внутрь терялось.
function explodeBomb(b, out) {
  const count = 16 + (boss ? boss.n * 2 : 0);
  const off = Math.random() * Math.PI * 2;
  for (let i = 0; i < count; i++) {
    const a = off + (i / count) * Math.PI * 2;
    out.push({
      x: b.x, y: b.y, vx: Math.cos(a) * SHARD_SPEED, vy: Math.sin(a) * SHARD_SPEED,
      damage: 8, r: 7, shape: 'diamond', color: '#ffb703'
    });
  }
  if (Math.hypot(b.x - player.x, b.y - player.y) < 100) damagePlayer(10, 8);
  spawnParticles(b.x, b.y, '#ffb703');
  sfxBoom();
}

function updateBoss(dt) {
  boss.hitFlash = Math.max(0, boss.hitFlash - dt);
  if (boss.jump) {
        const j = boss.jump;
    const WINDUP = 0.4; // сколько босс "прицеливается" на земле
    j.t += dt;
    if (j.t < WINDUP) {
      // на земле: цель ещё уточняется, но босс стоит на месте
      const remain = j.dur - j.t;
      j.tx = Math.max(60, Math.min(WORLD_W - 60, player.x + player.vx * remain * j.k + j.jx));
      j.ty = Math.max(60, Math.min(WORLD_H - 60, player.y + player.vy * remain * j.k + j.jy));
      j.p = 0;
      return;
    }
    // в воздухе: цель зафиксирована, летит строго по прямой
    const p = Math.min(1, (j.t - WINDUP) / (j.dur - WINDUP));
    j.p = p;
    boss.x = j.sx + (j.tx - j.sx) * p;
    boss.y = j.sy + (j.ty - j.sy) * p;
    if (p >= 1) {
      // приземление → удар по площади + звуковая волна: чем дальше игрок, тем меньше урон
      shockwaves.push({ x: boss.x, y: boss.y, r: 0, max: 400 + boss.n * 25, spd: 340, dmgBase: 6, dmgVar: 24, shake: 10, hit: false });
      if (Math.hypot(player.x - boss.x, player.y - boss.y) < 60) damagePlayer(25, 12);
      triggerShake(14);
      sfxBoom();
      boss.jump = null;
      boss.atk = 1.6;
    }
    return;
  }
  const ang = Math.atan2(player.y - boss.y, player.x - boss.x);
  const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
  if (dist > 200) {
    boss.x += Math.cos(ang) * boss.speed * dt;
    boss.y += Math.sin(ang) * boss.speed * dt;
  }
  boss.atk -= dt;
  if (boss.atk <= 0) {
    const a = bossAttack();
    if (!boss.jump) boss.atk = a === 'throw'
      ? Math.max(1.0, 1.9 - boss.n * 0.1)
      : Math.max(1.2, 2.5 - boss.n * 0.15);
  }
  if (dist < boss.size / 2 + PLAYER_SIZE / 2) damagePlayer(CONTACT_DPS * 2 * dt, 3);
}

function killBoss() {
  for (let i = 0; i < 6; i++) spawnParticles(boss.x, boss.y, boss.def.color);
  player.guns = Math.min(MAX_GUNS, player.guns + 1);
  pickups.push(makeCrate(boss.x, boss.y, true));
  // очки за босса не начисляем: счёт зависит только от времени (так работает проверка лидерборда)
  enemyBullets = [];
  shockwaves = [];
  triggerShake(16);
  sfxDeath(); sfxBoom();
  showToast(player.guns > 1 ? 'Босс повержен! Стволов: ' + player.guns : 'Босс повержен!', true);
  boss = null;
}

// ---------- Урон игроку ----------
function flashHurt(amount) {
  hurtFlash = Math.min(HURT_FLASH_MAX, hurtFlash + 0.08 + amount * 0.012);
}
function damagePlayer(amount, shake) {
  if (hasFx('shield')) return;
  player.hp -= amount;
  hurtFlag = true;
  flashHurt(amount);
  if (player.sprintCooldown <= 0) {
    player.sprintTimer = SPRINT_DURATION;
    player.sprintCooldown = SPRINT_COOLDOWN;
  }
  triggerShake(shake);
}

// ---------- Мир и камера ----------
let WORLD_W, WORLD_H;
let camera = { x: 0, y: 0 };

function updateCamera() {
  camera.x = Math.max(0, Math.min(WORLD_W - VW, player.x - VW / 2));
  camera.y = Math.max(0, Math.min(WORLD_H - VH, player.y - VH / 2));
}

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  // на телефоне меньшая сторона экрана ~400px → zoom ~0.67, камера видит дальше
  zoom = Math.max(MIN_ZOOM, Math.min(1, Math.min(W, H) / VIEW_TARGET));
  VW = W / zoom;
  VH = H / zoom;
  if (player && WORLD_W) {
    player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
    player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
    updateCamera();
  }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

function init() {
  resizeCanvas();
  switchTheme(currentTheme);
  WORLD_W = Math.max(2400, Math.round(VW * 1.8));
  WORLD_H = Math.max(1800, Math.round(VH * 1.8));
  player = { x: WORLD_W / 2, y: WORLD_H / 2, vx: 0, vy: 0, hp: 100, maxHp: 100, fireCooldown: 0, sprintTimer: 0, sprintCooldown: 0, guns: 1, fx: {} };
  bullets = []; enemyBullets = []; enemies = []; particles = []; shockwaves = [];
  score = 0; runTime = 0; scoreSubmitted = false;
  document.getElementById('submitStatus').textContent = '';
  document.getElementById('retrySubmitBtn').style.display = 'none';
  wave = 1; spawnTimer = 0;
  waveEnemiesTotal = enemiesPerWave(wave);
  waveEnemiesSpawned = 0; waveBreakTimer = 0;
  gameOver = false; paused = false; shakeIntensity = 0; hurtFlash = 0;
  plane = null; pickups = []; boss = null;
  updateCamera();
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('pauseOverlay').style.display = 'none';
  document.getElementById('settingsOverlay').style.display = 'none';
}

// ---------- Ввод ----------
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let joystick = { active: false, id: null, baseX: 0, baseY: 0, knobX: 0, knobY: 0, dx: 0, dy: 0 };

function touchPos(t) {
  const rect = canvas.getBoundingClientRect();
  return { x: (t.clientX - rect.left) * (W / rect.width), y: (t.clientY - rect.top) * (H / rect.height) };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (joystick.active) return;
  const t = e.changedTouches[0];
  const p = touchPos(t);
  joystick.active = true;
  joystick.id = t.identifier;
  joystick.baseX = p.x; joystick.baseY = p.y;
  joystick.knobX = p.x; joystick.knobY = p.y;
  joystick.dx = 0; joystick.dy = 0;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystick.active) return;
  let t = null;
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) { t = touch; break; }
  }
  if (!t) return;
  const p = touchPos(t);
  let ddx = p.x - joystick.baseX;
  let ddy = p.y - joystick.baseY;
  const dist = Math.hypot(ddx, ddy);
  if (dist > JOY_RADIUS) { ddx = ddx / dist * JOY_RADIUS; ddy = ddy / dist * JOY_RADIUS; }
  joystick.knobX = joystick.baseX + ddx;
  joystick.knobY = joystick.baseY + ddy;
  joystick.dx = ddx / JOY_RADIUS;
  joystick.dy = ddy / JOY_RADIUS;
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.id) { joystick.active = false; joystick.dx = 0; joystick.dy = 0; }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

function restart() {
  const loopStopped = gameOver; // цикл останавливается только после смерти; иначе не плодим второй
  init();
  lastTime = 0;
  if (loopStopped) requestAnimationFrame(loop);
}

// ---------- Пауза и настройки ----------
const pauseBtn = document.getElementById('pauseBtn');
const pauseOverlay = document.getElementById('pauseOverlay');
const settingsOverlay = document.getElementById('settingsOverlay');

  pauseOverlay.style.display = 'flex';
}
function closePause() {

}
pauseBtn.addEventListener('click', () => { ensureAudio(); openPause(); });
document.getElementById('resumeBtn').addEventListener('click', closePause);
document.getElementById('restartFromPauseBtn').addEventListener('click', () => {

});
document.getElementById('openSettingsBtn').addEventListener('click', () => {

});

});
document.querySelectorAll('#themeButtons button').forEach(btn => {

});

// ---------- Самолёт со снабжением ----------
function spawnPlane() {
  const horizontal = Math.random() < 0.5;
  let startX, startY, endX, endY;
  const margin = 60;
  if (horizontal) {
    const y = margin + Math.random() * (WORLD_H - margin * 2);
    const ltr = Math.random() < 0.5;
    startX = ltr ? -margin : WORLD_W + margin;
    endX = ltr ? WORLD_W + margin : -margin;
    startY = y; endY = y;
  } else {
    const x = margin + Math.random() * (WORLD_W - margin * 2);
    const ttb = Math.random() < 0.5;
    startY = ttb ? -margin : WORLD_H + margin;
    endY = ttb ? WORLD_H + margin : -margin;
    startX = x; endX = x;
  }
  const dist = Math.hypot(endX - startX, endY - startY);
  const dropProgress = 0.4 + Math.random() * 0.2;
  plane = {
    startX, startY, endX, endY, duration: dist / PLANE_SPEED,
    elapsed: 0, x: startX, y: startY, dropProgress, dropped: false,
    dropX: startX + (endX - startX) * dropProgress,
    dropY: startY + (endY - startY) * dropProgress
  };
}

// ---------- Спавн врагов ----------
function spawnEnemy(forceType) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  if (side === 0) { x = margin; y = margin + Math.random() * (WORLD_H - margin * 2); }
  else if (side === 1) { x = WORLD_W - margin; y = margin + Math.random() * (WORLD_H - margin * 2); }
  else if (side === 2) { x = margin + Math.random() * (WORLD_W - margin * 2); y = margin; }
  else { x = margin + Math.random() * (WORLD_W - margin * 2); y = WORLD_H - margin; }

  const typeKey = forceType || pickEnemyType();
  const type = ENEMY_TYPES[typeKey];
  const hueBase = THEMES[currentTheme].enemyHueBase;
  const speedFrac = Math.min(type.speedCap, type.speedFrac + (wave - 1) * ENEMY_SPEED_GROWTH);
  enemies.push({
    type: typeKey, x, y,
    hp: type.hpBase + Math.floor(wave / 3),
    speed: PLAYER_SPEED * speedFrac,
    size: ENEMY_SIZE * type.sizeMult,
    contactDps: CONTACT_DPS * type.contactDpsMult,
    color: `hsl(${(hueBase + type.hueOffset - wave * 5 + 360) % 360}, 70%, 55%)`,
    hitFlash: 0,
    jump: null,
    jumpCd: type.jumper ? 1 + Math.random() * type.jumpCd : 0,
    fireTimer: type.ranged ? Math.random() * type.shootInterval : 0
  });
}

// ---------- Обновление ----------
function update(dt) {
  if (gameOver) return;

  runTime += dt;
  score += (SCORE_BASE + (wave - 1) * SCORE_WAVE_GROWTH) * dt;
  shakeIntensity = Math.max(0, shakeIntensity - SHAKE_DECAY * dt);
  hurtFlag = false;
  hurtFlash = Math.max(0, hurtFlash - dt * 0.7);
  if (toastT > 0 && (toastT -= dt) <= 0) toastEl.style.opacity = 0;
  for (const k in player.fx) player.fx[k] = Math.max(0, player.fx[k] - dt);

  // --- движение ---
  let dx = 0, dy = 0;
  if (joystick.active) { dx = joystick.dx; dy = joystick.dy; }
  else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
  }
  if (hasFx('invert')) { dx = -dx; dy = -dy; }
  player.sprintTimer = Math.max(0, player.sprintTimer - dt);
  player.sprintCooldown = Math.max(0, player.sprintCooldown - dt);
  const speedMult = (player.sprintTimer > 0 ? SPRINT_MULT : 1) * (hasFx('speed_up') ? 1.35 : 1) * (hasFx('speed_down') ? 0.65 : 1);

  player.vx = dx * PLAYER_SPEED * speedMult; // скорость нужна боссу для упреждения гранат
  player.vy = dy * PLAYER_SPEED * speedMult;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = Math.max(PLAYER_SIZE, Math.min(WORLD_W - PLAYER_SIZE, player.x));
  player.y = Math.max(PLAYER_SIZE, Math.min(WORLD_H - PLAYER_SIZE, player.y));
  updateCamera();

  // --- автострельба (враги + босс) в пределах AUTO_RANGE, по player.guns стволов ---
  player.fireCooldown -= dt;
  const allTargets = boss ? enemies.concat([boss]) : enemies;
  let nearest = null, nd = AUTO_RANGE;
  for (const e of allTargets) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < nd) { nd = d; nearest = e; }
  }
  if (player.fireCooldown <= 0 && nearest) {
    const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    const px = -Math.sin(angle), py = Math.cos(angle);
    const dmg = hasFx('dmg_up') ? 2 : 1;
    for (let i = 0; i < player.guns; i++) {
      const o = (i - (player.guns - 1) / 2) * 12;
      bullets.push({
        x: player.x + px * o, y: player.y + py * o,
        vx: Math.cos(angle) * BULLET_SPEED, vy: Math.sin(angle) * BULLET_SPEED, dmg
      });
    }
    player.fireCooldown = FIRE_RATE * (hasFx('rate_up') ? 0.6 : 1) * (hasFx('rate_down') ? 1.7 : 1);
    sfxShoot();
  }

  bullets = bullets.filter(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    return b.x > -10 && b.x < WORLD_W + 10 && b.y > -10 && b.y < WORLD_H + 10;
  });

  // --- враги ---
  const rage = hasFx('rage') ? 1.4 : 1;
  for (const e of enemies) {
    const type = ENEMY_TYPES[e.type];
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    const sp = e.speed * rage;
    if (type.ranged) {
      if (dist > type.shootRange * 0.85) { e.x += Math.cos(angle) * sp * dt; e.y += Math.sin(angle) * sp * dt; }
      else if (dist < type.shootRange * 0.5) { e.x -= Math.cos(angle) * sp * dt; e.y -= Math.sin(angle) * sp * dt; }
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && dist < type.shootRange) {
        enemyBullets.push({
          x: e.x, y: e.y, vx: Math.cos(angle) * type.bulletSpeed, vy: Math.sin(angle) * type.bulletSpeed,
          damage: type.bulletDamage
        });
        e.fireTimer = type.shootInterval;
        sfxEnemyShot();
      }
    } else if (type.jumper) {
      if (e.jump) {
        const j = e.jump;
        j.t += dt;
        const p = Math.min(1, j.t / j.dur);
        e.x = j.sx + (j.tx - j.sx) * p;
        e.y = j.sy + (j.ty - j.sy) * p;
        if (p >= 1) { // приземление → мини-волна (чем дальше игрок, тем слабее)
          shockwaves.push({ x: e.x, y: e.y, r: 0, max: type.waveMax, spd: 300, dmgBase: type.waveDmgBase, dmgVar: type.waveDmgVar, shake: 5, hit: false });
          triggerShake(5);
          beep(80, 0.2, 'sawtooth', 0.08);
          e.jump = null;
          e.jumpCd = type.jumpCd * (0.8 + Math.random() * 0.4);
        }
      } else {
        if (dist > 70) { e.x += Math.cos(angle) * sp * dt; e.y += Math.sin(angle) * sp * dt; }
        e.jumpCd -= dt;
        if (e.jumpCd <= 0 && dist < type.jumpRange) {
          // прыгает не точно на игрока, а рядом с ним
          const oa = Math.random() * Math.PI * 2, od = 70 + Math.random() * 40;
          e.jump = {
            t: 0, dur: type.jumpDur, sx: e.x, sy: e.y,
            tx: Math.max(40, Math.min(WORLD_W - 40, player.x + Math.cos(oa) * od)),
            ty: Math.max(40, Math.min(WORLD_H - 40, player.y + Math.sin(oa) * od))
          };
        }
      }
    } else {
      e.x += Math.cos(angle) * sp * dt;
      e.y += Math.sin(angle) * sp * dt;
    }
  }

  // --- босс ---
  if (boss) updateBoss(dt);

  // --- пули врагов и бомбы (осколки собираем отдельно и добавляем ПОСЛЕ фильтра) ---
  const newShards = [];
  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.bomb) {
      b.fuse -= b.spd * dt;
      if (b.fuse <= 0 || Math.hypot(b.x - player.x, b.y - player.y) < 60) { explodeBomb(b, newShards); return false; }
      return true;
    }
    if (Math.hypot(b.x - player.x, b.y - player.y) < PLAYER_SIZE / 2 + (b.r || 4)) {
      damagePlayer(b.damage, 8);
      return false;
    }
    return b.x > -20 && b.x < WORLD_W + 20 && b.y > -20 && b.y < WORLD_H + 20;
  });
  if (newShards.length) enemyBullets = enemyBullets.concat(newShards);

  // --- звуковые волны босса ---
  shockwaves = shockwaves.filter(s => {
    s.r += (s.spd || 340) * dt;
    const d = Math.hypot(player.x - s.x, player.y - s.y);
    if (!s.hit && s.r >= d && d <= s.max) {
      s.hit = true;
      // чем дальше игрок от центра, тем меньше урон (у босса вплотную ~30, на краю ~6)
      damagePlayer(s.dmgBase + s.dmgVar * (1 - d / s.max), s.shake || 10);
    }
    return s.r < s.max;
  });

  // --- пули игрока → враги ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.size / 2 + 4) {
        bullets.splice(j, 1);
        e.hp -= b.dmg || 1;
        e.hitFlash = HIT_FLASH_DURATION;
        spawnParticles(e.x, e.y, e.color);
        sfxHit();
        if (e.hp <= 0) {
          if (Math.random() < ENEMY_DROP_CHANCE) pickups.push(makeCrate(e.x, e.y));
          enemies.splice(i, 1);
          sfxDeath();
        }
        break;
      }
    }
  }

  // --- пули игрока → босс ---
  if (boss) {
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.size / 2 + 4) {
        bullets.splice(j, 1);
        boss.hp -= b.dmg || 1;
        boss.hitFlash = HIT_FLASH_DURATION;
        spawnParticles(boss.x, boss.y, boss.def.color);
        sfxHit();
        if (boss.hp <= 0) { killBoss(); break; }
      }
    }
  }

  // --- контакт враг-игрок ---
  for (const e of enemies) {
    if (e.jump) continue; // в воздухе контактного урона нет
    if (Math.hypot(e.x - player.x, e.y - player.y) < e.size / 2 + PLAYER_SIZE / 2) {
      damagePlayer(e.contactDps * dt, 3);
    }
  }

  if (hurtFlag) {
    if (!update.dmgCooldown || update.dmgCooldown <= 0) {
      sfxDamage();
      update.dmgCooldown = DAMAGE_SOUND_COOLDOWN;
    }
  }
  update.dmgCooldown = Math.max(0, (update.dmgCooldown || 0) - dt);

  if (player.hp <= 0) {
    gameOver = true;
    document.getElementById('finalScore').textContent = Math.floor(score);
    document.getElementById('finalWave').textContent = wave;
    document.getElementById('gameover').style.display = 'block';
    submitScore();
  }

  particles = particles.filter(p => {
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
    return p.life > 0;
  });

  // --- волны: босс каждые BOSS_EVERY волн, следующая волна — только после его смерти ---
  if (waveBreakTimer > 0) {
    waveBreakTimer -= dt;
  } else if (waveEnemiesSpawned < waveEnemiesTotal) {
    spawnTimer += dt;
    const spawnInterval = Math.max(0.25, 1 - wave * 0.05);
    if (spawnTimer > spawnInterval) {
      spawnEnemy(wave % BOSS_EVERY === 0 ? (Math.random() < 0.7 ? 'chaser' : 'runner') : undefined);
      waveEnemiesSpawned++;
      spawnTimer = 0;
    }
  } else if (enemies.length === 0 && !boss) {
    wave++;
    const isBossWave = wave % BOSS_EVERY === 0;
    waveEnemiesTotal = isBossWave ? Math.min(16, 6 + (wave / BOSS_EVERY) * 2) : enemiesPerWave(wave);
    waveEnemiesSpawned = 0;
    spawnTimer = 0;
    waveBreakTimer = WAVE_BREAK;
    if (isBossWave) spawnBoss();
    if (!plane && wave % PLANE_WAVE_INTERVAL === 0) spawnPlane();
  }

  // --- самолёт: всегда сбрасывает аптечку ---
  if (plane) {
    plane.elapsed += dt;
    const progress = plane.elapsed / plane.duration;
    plane.x = plane.startX + (plane.endX - plane.startX) * progress;
    plane.y = plane.startY + (plane.endY - plane.startY) * progress;
    if (!plane.dropped && progress >= plane.dropProgress) {
      plane.dropped = true;
      pickups.push(makeMedkit(plane.dropX, plane.dropY));
    }
    if (progress >= 1) plane = null;
  }

  // --- ящики: покачивание, исчезновение через CRATE_LIFE секунд, подбор ---
  for (const p of pickups) { p.bobPhase += dt * 3; p.life -= dt; }
  pickups = pickups.filter(p => {
    if (p.life <= 0) return false;
    if (Math.hypot(p.x - player.x, p.y - player.y) < CRATE_SIZE / 2 + PLAYER_SIZE / 2) {
      collectPickup(p);
      return false;
    }
    return true;
  });

  // --- UI ---
  document.getElementById('hp').textContent = Math.max(0, Math.ceil(player.hp));
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('wave').textContent = wave;
  document.getElementById('remaining').textContent = boss ? 'БОСС' : (waveEnemiesTotal - waveEnemiesSpawned) + enemies.length;
  let fxHtml = '';
  for (const d of GOOD.concat(BAD)) {
    const t = player.fx[d.id];
    if (t > 0) fxHtml += `<div style="color:${GOOD.includes(d) ? '#7CFC00' : '#ff6b81'}">${d.label} ${Math.ceil(t)}с</div>`;
  }
  if (fxHtml !== lastFxHtml) { document.getElementById('fx').innerHTML = fxHtml; lastFxHtml = fxHtml; }
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 1;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: PARTICLE_LIFE, color });
  }
}

// ---------- Отрисовка ----------
function drawShape(shape, x, y, s, color) {
  ctx.fillStyle = color;
  ctx.save();
  ctx.translate(x, y);
  if (shape === 'diamond') {
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-s / 2, -s / 2, s, s);
  } else if (shape === 'circle') {
    ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill();
  } else if (shape === 'triangle') {
    ctx.beginPath(); ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(-s / 2, -s / 2, s, s);
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const shakeX = shakeIntensity > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;
  const shakeY = shakeIntensity > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;

  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

  ctx.strokeStyle = THEMES[currentTheme].gridColor;
  ctx.lineWidth = 1;
  const gridStartX = Math.floor(camera.x / 40) * 40;
  const gridStartY = Math.floor(camera.y / 40) * 40;
  for (let x = gridStartX; x < camera.x + VW; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + VH); ctx.stroke();
  }
  for (let y = gridStartY; y < camera.y + VH; y += 40) {
    ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + VW, y); ctx.stroke();
  }

  ctx.strokeStyle = THEMES[currentTheme].wallColor;
  ctx.lineWidth = WALL_THICKNESS;
  ctx.strokeRect(WALL_THICKNESS / 2, WALL_THICKNESS / 2, WORLD_W - WALL_THICKNESS, WORLD_H - WALL_THICKNESS);

  // звуковые волны
  for (const s of shockwaves) {
    ctx.strokeStyle = `rgba(255,217,61,${Math.max(0.2, 1 - s.r / s.max)})`;
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
  }

  for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }

  ctx.fillStyle = '#ffd93d';
  for (const b of bullets) ctx.fillRect(b.x - 3, b.y - 3, 6, 6);

  // пули врагов / бомбы / осколки
  for (const b of enemyBullets) {
    if (b.bomb) {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(b.x, b.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = Math.floor(performance.now() / 120) % 2 ? '#ff5566' : '#ffb703';
      ctx.lineWidth = 3; ctx.stroke();
    } else {
      drawShape(b.shape || 'square', b.x, b.y, (b.r || 4) * 2, b.color || '#ff5566');
    }
  }

  // ящики: из врагов — жёлтый "?", с самолёта — зелёная аптечка "+"; в последние 5 секунд мигают
  for (const p of pickups) {
    if (p.life < 5 && Math.floor(p.life * 6) % 2 === 0) continue;
    const bob = Math.sin(p.bobPhase) * 4;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    if (p.known && medkitReady) {
      ctx.imageSmoothingEnabled = false; // чтобы пиксель-арт не размывался
      const fw = medkitImg.naturalWidth / MEDKIT_COLS, fh = medkitImg.naturalHeight / MEDKIT_ROWS;
      const f = Math.floor(performance.now() / 1000 * MEDKIT_FPS) % (MEDKIT_COLS * MEDKIT_ROWS);
      const w = MEDKIT_DRAW_SIZE, h = MEDKIT_DRAW_SIZE * fh / fw;
      ctx.drawImage(medkitImg, (f % MEDKIT_COLS) * fw, Math.floor(f / MEDKIT_COLS) * fh, fw, fh, -w / 2, -h / 2, w, h);
      ctx.restore();
      continue;
    }
    ctx.fillStyle = p.known ? '#7CFC00' : '#ffd93d';
    ctx.fillRect(-CRATE_SIZE / 2, -CRATE_SIZE / 2, CRATE_SIZE, CRATE_SIZE);
    ctx.strokeStyle = '#0d1117'; ctx.lineWidth = 2;
    ctx.strokeRect(-CRATE_SIZE / 2, -CRATE_SIZE / 2, CRATE_SIZE, CRATE_SIZE);
    ctx.fillStyle = '#0d1117';
    ctx.font = 'bold 18px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.known ? '+' : '?', 0, 1);
    ctx.restore();
  }

  for (const e of enemies) {
    let lift = 0;
    if (e.jump) { // прыгающий жирный моб: тень на земле, слабый круг на месте приземления
      lift = Math.sin(Math.PI * Math.min(1, e.jump.t / e.jump.dur)) * 40;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.size / 2, e.size / 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,80,80,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.jump.tx, e.jump.ty, 26, 0, Math.PI * 2); ctx.stroke();
    }
    drawShape(ENEMY_TYPES[e.type].shape, e.x, e.y - lift, e.size, e.hitFlash > 0 ? '#ffffff' : e.color);
  }

  // босс (при прыжке — тень на земле + тело, подброшенное вверх)
  if (boss) {
    let lift = 0;
    if (boss.jump) {
      lift = Math.sin(Math.PI * Math.min(1, boss.jump.t / boss.jump.dur)) * 90;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(boss.x, boss.y, boss.size / 2, boss.size / 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    drawShape(boss.def.shape, boss.x, boss.y - lift, boss.size, boss.hitFlash > 0 ? '#ffffff' : boss.def.color);
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(boss.x - 12, boss.y - lift - 6, 7, 7);
    ctx.fillRect(boss.x + 5, boss.y - lift - 6, 7, 7);
  }

  if (plane) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(plane.x, plane.y, 30, 16, 0, 0, Math.PI * 2); ctx.fill();
    const angle = Math.atan2(plane.endY - plane.startY, plane.endX - plane.startX);
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#cccccc';
    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-16, -10); ctx.lineTo(-8, 0); ctx.lineTo(-16, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // игрок
  ctx.fillStyle = THEMES[currentTheme].playerColor;
  ctx.fillRect(player.x - PLAYER_SIZE / 2, player.y - PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(player.x - 6, player.y - 4, 3, 3);
  ctx.fillRect(player.x + 3, player.y - 4, 3, 3);
  if (hasFx('shield')) {
    ctx.strokeStyle = 'rgba(80,200,255,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_SIZE, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // полоса HP босса (экранные координаты)
  if (boss) {
    const bw = Math.min(W * 0.7, 420), bx = (W - bw) / 2, by = 64;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 16);
    ctx.fillStyle = boss.def.color; ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 12);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(boss.def.name, W / 2, by - 6);
  }

  // стрелки на краю экрана: откуда стреляют дальнобойные враги, которых не видно
  for (const e of enemies) {
    const t = ENEMY_TYPES[e.type];
    if (!t.ranged || Math.hypot(e.x - player.x, e.y - player.y) > t.shootRange * 1.1) continue;
    const sx = (e.x - camera.x) * zoom, sy = (e.y - camera.y) * zoom;
    if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) continue;
    const cx = W / 2, cy = H / 2, ddx = sx - cx, ddy = sy - cy, m = 24;
    const k = Math.min((cx - m) / (Math.abs(ddx) || 1e-6), (cy - m) / (Math.abs(ddy) || 1e-6));
    ctx.save();
    ctx.translate(cx + ddx * k, cy + ddy * k);
    ctx.rotate(Math.atan2(ddy, ddx));
    ctx.fillStyle = 'rgba(255,85,102,0.85)';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // красная вспышка при получении урона
  if (hurtFlash > 0.005) {
    ctx.fillStyle = 'rgba(255,0,0,' + hurtFlash.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // джойстик
  if (joystick.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, JOY_RADIUS, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(joystick.knobX, joystick.knobY, 22, 0, Math.PI * 2); ctx.fill();
  }
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  dt = Math.min(dt, 0.05);

  if (!paused && started) update(dt);
  draw();
  if (!gameOver) requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
